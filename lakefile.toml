name = "lean_swarm_orchestrator"
version = "0.1.0"
defaultTargets = ["LeanSwarmOrchestrator"]

[lean_options]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.18.0"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop.git"
rev = "v4.18.0"

[[lean_lib]]
name = "LeanSwarmOrchestrator"
srcDir = "LeanSwarmOrchestrator"
